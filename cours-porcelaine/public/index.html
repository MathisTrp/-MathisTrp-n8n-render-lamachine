<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cours de peinture sur porcelaine</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="page">
    <header class="entete">
      <h1>Cours de peinture sur porcelaine</h1>
      <div class="filet-or"></div>
      <p class="sous-titre">Choisissez une date pour vous inscrire</p>
    </header>

    <!-- Écran 1 : calendrier des cours -->
    <section id="ecran-liste">
      <div id="etat-chargement">
        <p class="info">Chargement des cours…</p>
      </div>
      <div id="calendrier-public" class="calendrier cache"></div>
      <div id="legende-calendrier" class="calendrier-legende cache">
        <span><span class="puce cours"></span>Cours</span>
        <span><span class="puce stage"></span>Stage</span>
      </div>
      <p id="aide-calendrier" class="aide-calendrier cache">Cliquez sur une date en couleur pour voir le cours du jour. Une ligne continue indique un stage sur plusieurs jours.</p>
      <div id="jour-selectionne"></div>
    </section>

    <!-- Écran 2 : formulaire d'inscription -->
    <section id="ecran-form" class="cache">
      <button type="button" class="retour" id="btn-retour">&larr; Retour à la liste des cours</button>

      <div class="carte">
        <div class="recap" id="recap-cours"></div>

        <form id="form-inscription" novalidate>
          <label for="prenom">Prénom</label>
          <input type="text" id="prenom" name="prenom" autocomplete="given-name" required />

          <label for="nom">Nom</label>
          <input type="text" id="nom" name="nom" autocomplete="family-name" required />

          <label for="email">Adresse e-mail</label>
          <input type="email" id="email" name="email" autocomplete="email" required />

          <button type="submit" class="bouton" id="btn-payer">Réserver et payer</button>

          <div id="message" class="message cache"></div>
        </form>
      </div>
    </section>
  </div>

  <script src="/calendar.js"></script>
  <script>
    var courses = [];
    var coursChoisi = null;
    var eventsParJour = {};
    var calYear = null;
    var calMonth = null;
    var dateSelectionnee = null;

    var ecranListe = document.getElementById('ecran-liste');
    var ecranForm = document.getElementById('ecran-form');
    var etatChargement = document.getElementById('etat-chargement');
    var calendrierEl = document.getElementById('calendrier-public');
    var legendeCalendrier = document.getElementById('legende-calendrier');
    var aideCalendrier = document.getElementById('aide-calendrier');
    var jourSelectionneEl = document.getElementById('jour-selectionne');
    var recapEl = document.getElementById('recap-cours');
    var messageEl = document.getElementById('message');
    var form = document.getElementById('form-inscription');
    var btnPayer = document.getElementById('btn-payer');
    var btnRetour = document.getElementById('btn-retour');

    function echapper(texte) {
      var div = document.createElement('div');
      div.textContent = texte == null ? '' : String(texte);
      return div.innerHTML;
    }

    function formaterDate(dateStr) {
      var d = new Date(dateStr + 'T00:00:00');
      if (isNaN(d.getTime())) return dateStr;
      var options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
      var texte = d.toLocaleDateString('fr-FR', options);
      return texte.charAt(0).toUpperCase() + texte.slice(1);
    }

    function formaterJourMois(dateStr) {
      var d = new Date(dateStr + 'T00:00:00');
      if (isNaN(d.getTime())) return dateStr;
      return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' });
    }

    function estMultiJours(course) {
      return course.dateFin && course.dateFin !== course.date;
    }

    function formaterPlage(course) {
      if (!estMultiJours(course)) return formaterDate(course.date);
      return 'Du ' + formaterJourMois(course.date) + ' au ' + formaterDate(course.dateFin);
    }

    function chargerCours() {
      fetch('/api/courses')
        .then(function (res) { return res.json(); })
        .then(function (data) {
          courses = data;
          preparerCalendrier();
        })
        .catch(function () {
          etatChargement.innerHTML = '<p class="info">Impossible de charger les cours pour le moment. Merci de réessayer plus tard.</p>';
        });
    }

    function preparerCalendrier() {
      if (!courses.length) {
        etatChargement.innerHTML = '<p class="info">Aucun cours n\'est ouvert aux inscriptions pour le moment.</p>';
        return;
      }

      etatChargement.innerHTML = '';

      eventsParJour = CalendrierPorcelaine.etalerEvenements(courses);

      var premiereDate = new Date(courses[0].date + 'T00:00:00');
      calYear = premiereDate.getFullYear();
      calMonth = premiereDate.getMonth();

      calendrierEl.classList.remove('cache');
      legendeCalendrier.classList.remove('cache');
      aideCalendrier.classList.remove('cache');
      afficherCalendrier();
    }

    function afficherCalendrier() {
      CalendrierPorcelaine.creer({
        container: calendrierEl,
        year: calYear,
        month: calMonth,
        eventsParJour: eventsParJour,
        dateSelectionnee: dateSelectionnee,
        onPrev: function () {
          calMonth -= 1;
          if (calMonth < 0) { calMonth = 11; calYear -= 1; }
          afficherCalendrier();
        },
        onNext: function () {
          calMonth += 1;
          if (calMonth > 11) { calMonth = 0; calYear += 1; }
          afficherCalendrier();
        },
        onDayClick: function (dateKey) {
          dateSelectionnee = dateKey;
          afficherCalendrier();
          afficherJourSelectionne(dateKey);
        },
      });
    }

    function carteHTML(course) {
      var estStage = course.type === 'stage';
      var classes = 'course-card' + (estStage ? ' stage' : '') + (course.complet ? ' complet' : '');
      var html = '<button type="button" class="' + classes + '" data-id="' + course.id + '"' + (course.complet ? ' disabled' : '') + '>';
      if (course.complet) {
        html += '<span class="badge">Complet</span>';
      }
      html += '<h2>' + echapper(course.titre) + '</h2>';
      html += '<span class="niveau niveau-type-' + (estStage ? 'stage' : 'cours') + '">' + (estStage ? 'Stage' : 'Cours') + '</span>';
      html += '<span class="niveau">' + echapper(course.niveau) + '</span>';
      if (estMultiJours(course)) {
        html += '<p class="plage-dates"><span class="trait"></span>' + echapper(formaterPlage(course)) + '</p>';
      }
      html += '<p class="details">' + (estMultiJours(course) ? 'À partir de ' + echapper(course.heure) : echapper(formaterDate(course.date)) + ' à ' + echapper(course.heure)) + (course.duree ? ' · ' + echapper(course.duree) : '') + '</p>';
      html += '<p class="details">' + echapper(course.lieu) + '</p>';
      html += '<p class="prix">' + echapper(course.prix) + ' €</p>';
      html += '</button>';
      return html;
    }

    function afficherJourSelectionne(dateKey) {
      var coursDuJour = eventsParJour[dateKey] || [];

      if (!coursDuJour.length) {
        jourSelectionneEl.innerHTML = '<p class="info">Aucun cours prévu à cette date.</p>';
        return;
      }

      var html = '<h2 class="jour-titre">' + echapper(formaterDate(dateKey)) + '</h2>';
      coursDuJour.forEach(function (course) {
        html += carteHTML(course);
      });
      jourSelectionneEl.innerHTML = html;

      coursDuJour.forEach(function (course) {
        if (course.complet) return;
        var carte = jourSelectionneEl.querySelector('.course-card[data-id="' + course.id + '"]');
        if (carte) {
          carte.addEventListener('click', function () { choisirCours(course); });
        }
      });

      jourSelectionneEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function choisirCours(course) {
      coursChoisi = course;

      recapEl.innerHTML =
        '<h2>' + echapper(course.titre) + '</h2>' +
        '<p>' + (course.type === 'stage' ? 'Stage' : 'Cours') + ' · ' + echapper(course.niveau) + '</p>' +
        '<p>' + echapper(formaterPlage(course)) + (estMultiJours(course) ? ', à partir de ' : ' à ') + echapper(course.heure) + (course.duree ? ' · ' + echapper(course.duree) : '') + '</p>' +
        '<p>' + echapper(course.lieu) + '</p>' +
        '<p><strong>' + echapper(course.prix) + ' €</strong></p>';

      form.reset();
      messageEl.classList.add('cache');
      btnPayer.disabled = false;
      btnPayer.textContent = 'Réserver et payer';

      ecranListe.classList.add('cache');
      ecranForm.classList.remove('cache');
      window.scrollTo(0, 0);
    }

    function retourListe() {
      ecranForm.classList.add('cache');
      ecranListe.classList.remove('cache');
      coursChoisi = null;
      window.scrollTo(0, 0);
    }

    function afficherMessage(texte, type) {
      messageEl.textContent = texte;
      messageEl.className = 'message ' + type;
    }

    btnRetour.addEventListener('click', retourListe);

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      if (!coursChoisi) return;

      var prenom = document.getElementById('prenom').value.trim();
      var nom = document.getElementById('nom').value.trim();
      var email = document.getElementById('email').value.trim();

      if (!prenom || !nom || !email) {
        afficherMessage('Merci de remplir votre prénom, votre nom et votre e-mail.', 'erreur');
        return;
      }

      btnPayer.disabled = true;
      btnPayer.textContent = 'Un instant…';
      messageEl.classList.add('cache');

      fetch('/api/create-checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          courseId: coursChoisi.id,
          prenom: prenom,
          nom: nom,
          email: email,
        }),
      })
        .then(function (res) {
          return res.json().then(function (data) { return { ok: res.ok, data: data }; });
        })
        .then(function (result) {
          if (!result.ok || !result.data.checkoutUrl) {
            throw new Error((result.data && result.data.error) || 'Une erreur est survenue.');
          }
          window.location.href = result.data.checkoutUrl;
        })
        .catch(function (err) {
          btnPayer.disabled = false;
          btnPayer.textContent = 'Réserver et payer';
          afficherMessage(err.message || 'Une erreur est survenue. Merci de réessayer.', 'erreur');
        });
    });

    chargerCours();
  </script>
</body>
</html>
